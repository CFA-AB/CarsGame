<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polytrack — Jeu de course 3D</title>
  <meta name="description" content="Jeu de course 3D low-poly dans le navigateur. Conduis ta voiture sur une piste colorée !">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 15px;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
      line-height: 1.8;
    }
    #hud .label {
      font-size: 10px;
      opacity: 0.5;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #hud .value {
      font-size: 22px;
      font-weight: bold;
    }
    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      letter-spacing: 1px;
      pointer-events: none;
      white-space: nowrap;
    }
    #start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(8, 10, 22, 0.92);
      color: #fff;
      z-index: 10;
    }
    #start-screen h1 {
      font-size: clamp(40px, 8vw, 80px);
      letter-spacing: 8px;
      font-weight: 900;
      color: #4a90e2;
      text-shadow: 0 0 40px rgba(74,144,226,0.4);
      margin-bottom: 8px;
    }
    #start-screen .subtitle {
      font-size: 13px;
      opacity: 0.4;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }
    #start-btn {
      padding: 14px 48px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
      background: transparent;
      color: #4a90e2;
      border: 2px solid #4a90e2;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      transition: all 0.2s;
    }
    #start-btn:hover {
      background: #4a90e2;
      color: #0d0f1a;
    }
    #finish-screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(8, 10, 22, 0.92);
      color: #fff;
      z-index: 10;
    }
    #finish-screen h2 {
      font-size: 48px;
      color: #ffd700;
      letter-spacing: 4px;
      margin-bottom: 16px;
    }
    #finish-time {
      font-size: 24px;
      opacity: 0.7;
      margin-bottom: 32px;
    }
    #restart-btn {
      padding: 12px 40px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 3px;
      background: transparent;
      color: #ffd700;
      border: 2px solid #ffd700;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      transition: all 0.2s;
    }
    #restart-btn:hover { background: #ffd700; color: #0d0f1a; }
    #timer-display {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      text-align: right;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }
    #minimap {
      position: absolute;
      bottom: 60px;
      right: 20px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="game-wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="label">vitesse</div>
    <div class="value" id="speed-display">0 <span style="font-size:13px;opacity:0.5">km/h</span></div>
    <br>
    <div class="label">tour</div>
    <div class="value" id="lap-display">1 <span style="font-size:13px;opacity:0.5">/ 3</span></div>
  </div>
  <div id="timer-display">
    <div style="font-size:10px;opacity:0.5;letter-spacing:2px;">TEMPS</div>
    <div style="font-size:22px;font-weight:bold;" id="time-display">0:00.0</div>
  </div>
  <canvas id="minimap" width="120" height="120"></canvas>
  <div id="controls-hint">↑ accélérer &nbsp;|&nbsp; ↓ freiner &nbsp;|&nbsp; ← → tourner &nbsp;|&nbsp; R reset</div>
  <div id="start-screen">
    <h1>POLYTRACK</h1>
    <div class="subtitle">jeu de course 3d low-poly</div>
    <button id="start-btn" onclick="startGame()">DÉMARRER</button>
  </div>
  <div id="finish-screen">
    <h2>🏁 ARRIVÉE !</h2>
    <div id="finish-time"></div>
    <button id="restart-btn" onclick="restartGame()">REJOUER</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('gameCanvas');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(canvas.width, canvas.height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a1a2e, 80, 220);
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(60, canvas.width / canvas.height, 0.1, 400);
camera.position.set(0, 8, -14);

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  renderer.setSize(canvas.width, canvas.height);
  camera.aspect = canvas.width / canvas.height;
  camera.updateProjectionMatrix();
});

// Lighting
const ambient = new THREE.AmbientLight(0x334466, 1.4);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffeebb, 1.8);
sun.position.set(40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 300;
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x446688, 0.5);
fill.position.set(-20, 10, -20);
scene.add(fill);

// Sky gradient via background color + fog
scene.background = new THREE.Color(0x0d1b3e);

// Stars
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 2000; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 180 + Math.random() * 20;
  starVerts.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 });
scene.add(new THREE.Points(starGeo, starMat));

// Track path
const trackRadius = 42;
const trackSegments = 100;
const trackPoints = [];
for (let i = 0; i < trackSegments; i++) {
  const a = (i / trackSegments) * Math.PI * 2;
  const wobble = Math.sin(a * 3) * 7 + Math.cos(a * 2) * 5 + Math.sin(a * 5) * 2;
  const r = trackRadius + wobble;
  const x = Math.cos(a) * r;
  const z = Math.sin(a) * r;
  const y = Math.sin(a * 2) * 2 + Math.cos(a * 3) * 1;
  trackPoints.push(new THREE.Vector3(x, y, z));
}
trackPoints.push(trackPoints[0].clone());
const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true);
const trackWidth = 8;
const trackDivisions = 300;
const trackPositions = trackCurve.getPoints(trackDivisions);

// Build track mesh
const trackGeo = new THREE.BufferGeometry();
const verts = [], cols = [], idx = [];
for (let i = 0; i <= trackDivisions; i++) {
  const curr = trackPositions[i % trackDivisions];
  const next = trackPositions[(i + 1) % trackDivisions];
  const dir = next.clone().sub(curr).normalize();
  const right = dir.clone().cross(new THREE.Vector3(0,1,0)).normalize();
  const lp = curr.clone().addScaledVector(right, -trackWidth / 2);
  const rp = curr.clone().addScaledVector(right, trackWidth / 2);
  verts.push(lp.x, lp.y, lp.z, rp.x, rp.y, rp.z);
  const t2 = i / trackDivisions;
  const r = 0.25 + Math.sin(t2 * Math.PI * 6) * 0.03;
  const g = 0.28 + Math.cos(t2 * Math.PI * 4) * 0.02;
  const b = 0.35 + Math.sin(t2 * Math.PI * 8) * 0.03;
  cols.push(r, g, b, r, g, b);
}
for (let i = 0; i < trackDivisions; i++) {
  const a = i * 2, b = a + 1, c2 = a + 2, d = a + 3;
  idx.push(a, b, c2, b, d, c2);
}
trackGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
trackGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
trackGeo.setIndex(idx);
trackGeo.computeVertexNormals();
const trackMesh = new THREE.Mesh(trackGeo, new THREE.MeshLambertMaterial({ vertexColors: true }));
trackMesh.receiveShadow = true;
scene.add(trackMesh);

// Track borders
for (let i = 0; i < trackDivisions; i += 6) {
  const pos = trackPositions[i];
  const next = trackPositions[(i + 1) % trackDivisions];
  const dir = next.clone().sub(pos).normalize();
  const right = dir.clone().cross(new THREE.Vector3(0,1,0)).normalize();
  for (let s of [-1, 1]) {
    const side = pos.clone().addScaledVector(right, s * (trackWidth / 2 + 1.2));
    const h = 0.7 + Math.random() * 0.6;
    const geo = new THREE.BoxGeometry(0.35, h, 0.35);
    const isRed = (Math.floor(i / 6) % 2 === 0);
    const col = s > 0 ? (isRed ? 0xdd3333 : 0xffffff) : (isRed ? 0xffffff : 0xdd3333);
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: col }));
    mesh.position.copy(side);
    mesh.position.y += h / 2;
    mesh.castShadow = true;
    scene.add(mesh);
  }
}

// Start/finish line
const finishGeo = new THREE.PlaneGeometry(trackWidth, 1.5);
const finishMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const finishLine = new THREE.Mesh(finishGeo, finishMat);
const startPos = trackPositions[0];
finishLine.position.copy(startPos);
finishLine.position.y += 0.05;
finishLine.rotation.x = -Math.PI / 2;
scene.add(finishLine);

// Ground
const groundGeo = new THREE.PlaneGeometry(400, 400, 30, 30);
const groundVerts2 = groundGeo.attributes.position;
for (let i = 0; i < groundVerts2.count; i++) {
  groundVerts2.setY(i, Math.random() * 0.4 - 0.2);
}
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ color: 0x1e4a1a }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2;
ground.receiveShadow = true;
scene.add(ground);

// Trees
for (let i = 0; i < 120; i++) {
  const h = 3 + Math.random() * 10;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.3, h * 0.35, 5),
    new THREE.MeshLambertMaterial({ color: 0x5c3d1e })
  );
  const foliage = new THREE.Mesh(
    new THREE.ConeGeometry(1.2 + Math.random(), h * 0.8, 5 + Math.floor(Math.random() * 3)),
    new THREE.MeshLambertMaterial({ color: new THREE.Color(0.08 + Math.random()*0.15, 0.35 + Math.random()*0.3, 0.08) })
  );
  const angle = Math.random() * Math.PI * 2;
  const dist = 55 + Math.random() * 100;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  trunk.position.set(x, -2 + h*0.1, z);
  foliage.position.set(x, -2 + h*0.65, z);
  trunk.castShadow = true;
  foliage.castShadow = true;
  scene.add(trunk);
  scene.add(foliage);
}

// Mountains
const mtColors = [0x3a4a5a, 0x4a5a6a, 0x2a3545, 0x5a6070, 0x3a5055];
for (let i = 0; i < 16; i++) {
  const h = 25 + Math.random() * 55;
  const geo = new THREE.ConeGeometry(18 + Math.random()*22, h, 4 + Math.floor(Math.random()*4));
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: mtColors[i % mtColors.length] }));
  const angle = (i / 16) * Math.PI * 2 + Math.random() * 0.4;
  const dist = 120 + Math.random() * 60;
  mesh.position.set(Math.cos(angle)*dist, h/2 - 2, Math.sin(angle)*dist);
  scene.add(mesh);
}

// Snow caps
for (let i = 0; i < 8; i++) {
  const geo = new THREE.ConeGeometry(4 + Math.random()*5, 8 + Math.random()*12, 4);
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0xeeeeff }));
  const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.8;
  const dist = 130 + Math.random() * 50;
  const h = 55 + Math.random() * 20;
  mesh.position.set(Math.cos(angle)*dist, h/2, Math.sin(angle)*dist);
  scene.add(mesh);
}

// Car
const carGroup = new THREE.Group();
const bodyMesh = new THREE.Mesh(
  new THREE.BoxGeometry(1.9, 0.52, 3.8),
  new THREE.MeshLambertMaterial({ color: 0x4a90e2 })
);
bodyMesh.position.y = 0.26;
bodyMesh.castShadow = true;
carGroup.add(bodyMesh);

const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.45, 0.58, 2.1),
  new THREE.MeshLambertMaterial({ color: 0x2266bb })
);
cabin.position.set(0, 0.81, -0.1);
cabin.castShadow = true;
carGroup.add(cabin);

const windshield = new THREE.Mesh(
  new THREE.BoxGeometry(1.4, 0.42, 0.08),
  new THREE.MeshLambertMaterial({ color: 0x99ccff, transparent: true, opacity: 0.65 })
);
windshield.position.set(0, 0.88, 0.94);
carGroup.add(windshield);

// Headlights
for (let lx of [-0.7, 0.7]) {
  const hl = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.15, 0.08),
    new THREE.MeshLambertMaterial({ color: 0xffffcc, emissive: 0xffff88, emissiveIntensity: 0.5 })
  );
  hl.position.set(lx, 0.35, 1.9);
  carGroup.add(hl);
}

// Taillights
for (let lx of [-0.7, 0.7]) {
  const tl = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.15, 0.08),
    new THREE.MeshLambertMaterial({ color: 0xff2200, emissive: 0xff0000, emissiveIntensity: 0.5 })
  );
  tl.position.set(lx, 0.35, -1.9);
  carGroup.add(tl);
}

const wheelGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.3, 10);
const wheelMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
const rimMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
const wheels = [];
for (let [wx, wy, wz] of [[-1, -0.08, 1.25], [1, -0.08, 1.25], [-1, -0.08, -1.25], [1, -0.08, -1.25]]) {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI / 2;
  w.position.set(wx, wy, wz);
  w.castShadow = true;
  carGroup.add(w);
  wheels.push(w);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.31, 6), rimMat);
  rim.rotation.z = Math.PI / 2;
  rim.position.set(wx, wy, wz);
  carGroup.add(rim);
}

scene.add(carGroup);

// Minimap
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');

function drawMinimap(carT) {
  mmCtx.clearRect(0, 0, 120, 120);
  mmCtx.fillStyle = 'rgba(0,0,0,0.5)';
  mmCtx.beginPath();
  mmCtx.arc(60, 60, 58, 0, Math.PI * 2);
  mmCtx.fill();

  mmCtx.strokeStyle = 'rgba(255,255,255,0.25)';
  mmCtx.lineWidth = 3;
  mmCtx.beginPath();
  const pts = trackCurve.getPoints(120);
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const p of pts) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); }
  const scaleX = 100 / (maxX - minX);
  const scaleZ = 100 / (maxZ - minZ);
  const sc = Math.min(scaleX, scaleZ);
  for (let i = 0; i < pts.length; i++) {
    const mx = (pts[i].x - minX) * sc + 10;
    const mz = (pts[i].z - minZ) * sc + 10;
    i === 0 ? mmCtx.moveTo(mx, mz) : mmCtx.lineTo(mx, mz);
  }
  mmCtx.closePath();
  mmCtx.stroke();

  const cp = trackCurve.getPointAt(carT);
  const cx = (cp.x - minX) * sc + 10;
  const cz = (cp.z - minZ) * sc + 10;
  mmCtx.fillStyle = '#4a90e2';
  mmCtx.beginPath();
  mmCtx.arc(cx, cz, 4, 0, Math.PI * 2);
  mmCtx.fill();
}

// Physics
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

let t = 0;
let speed = 0;
let steerAngle = 0;
let carYaw = 0;
let lapCount = 1;
let lastT = 0.99;
let lapCheckCooldown = 0;
let running = false;
let startTime = 0;
let elapsedTime = 0;
let gameFinished = false;

const MAX_SPEED = 0.0085;
const ACCEL = 0.000085;
const FRICTION = 0.935;
const STEER_SPEED = 0.032;
const STEER_RETURN = 0.87;

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  const tenth = Math.floor((ms % 1000) / 100);
  return `${m}:${sec.toString().padStart(2,'0')}.${tenth}`;
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  running = true;
  startTime = performance.now();
  animate();
}

function restartGame() {
  document.getElementById('finish-screen').style.display = 'none';
  t = 0; speed = 0; steerAngle = 0; carYaw = 0;
  lapCount = 1; lastT = 0.99; lapCheckCooldown = 0;
  gameFinished = false;
  startTime = performance.now();
  document.getElementById('lap-display').textContent = '1 / 3';
}

let animFrameId = null;
function animate() {
  animFrameId = requestAnimationFrame(animate);

  if (!running || gameFinished) {
    renderer.render(scene, camera);
    return;
  }

  elapsedTime = performance.now() - startTime;
  document.getElementById('time-display').textContent = formatTime(elapsedTime);

  if (keys['ArrowUp'] || keys['w'] || keys['z']) {
    speed = Math.min(speed + ACCEL, MAX_SPEED);
  } else if (keys['ArrowDown'] || keys['s']) {
    speed = Math.max(speed - ACCEL * 1.6, -MAX_SPEED * 0.45);
  } else {
    speed *= FRICTION;
    if (Math.abs(speed) < 0.000005) speed = 0;
  }

  if (keys['ArrowLeft'] || keys['q'] || keys['a']) {
    steerAngle = Math.min(steerAngle + STEER_SPEED, 1.1);
  } else if (keys['ArrowRight'] || keys['d']) {
    steerAngle = Math.max(steerAngle - STEER_SPEED, -1.1);
  } else {
    steerAngle *= STEER_RETURN;
  }

  if (keys['r'] || keys['R']) {
    speed = 0; steerAngle = 0;
    t = Math.round(t * trackDivisions) / trackDivisions;
  }

  const steerInfluence = steerAngle * speed * 0.36;
  carYaw += steerInfluence;

  t += speed;
  if (t > 1) t -= 1;
  if (t < 0) t += 1;

  const carPos = trackCurve.getPointAt(t);
  const tangent = trackCurve.getTangentAt(t);

  const carDir = new THREE.Vector3(
    Math.sin(carYaw) * tangent.z + Math.cos(carYaw) * tangent.x,
    tangent.y,
    Math.cos(carYaw) * tangent.z - Math.sin(carYaw) * tangent.x
  ).normalize();

  carGroup.position.copy(carPos);
  carGroup.position.y += 0.38;
  carGroup.lookAt(carPos.clone().add(carDir));
  carGroup.rotation.z = steerAngle * 0.07;

  wheels.forEach(w => { w.rotation.y += speed * 28; });

  const camOffset = carDir.clone().multiplyScalar(-13).add(new THREE.Vector3(0, 5.5, 0));
  const targetCamPos = carPos.clone().add(camOffset);
  camera.position.lerp(targetCamPos, 0.07);
  camera.lookAt(carPos.clone().add(new THREE.Vector3(0, 1.2, 0)));

  if (lapCheckCooldown > 0) lapCheckCooldown--;

  if (lapCheckCooldown === 0 && lastT > 0.97 && t < 0.03) {
    if (lapCount < 3) {
      lapCount++;
      document.getElementById('lap-display').textContent = `${lapCount} / 3`;
      lapCheckCooldown = 60;
    } else {
      gameFinished = true;
      document.getElementById('finish-screen').style.display = 'flex';
      document.getElementById('finish-time').textContent = 'Temps : ' + formatTime(elapsedTime);
    }
  }
  lastT = t;

  const kmh = Math.round(Math.abs(speed) / MAX_SPEED * 160);
  document.getElementById('speed-display').textContent = kmh + ' <span style="font-size:13px;opacity:0.5">km/h</span>';

  drawMinimap(t);
  renderer.render(scene, camera);
}

// Touch controls for mobile
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: true });
canvas.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  keys['ArrowLeft'] = dx < -20;
  keys['ArrowRight'] = dx > 20;
  keys['ArrowUp'] = dy < -10;
  keys['ArrowDown'] = dy > 30;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => {
  keys['ArrowLeft'] = keys['ArrowRight'] = keys['ArrowUp'] = keys['ArrowDown'] = false;
});

// Initial render
renderer.render(scene, camera);
</script>
</body>
</html>
